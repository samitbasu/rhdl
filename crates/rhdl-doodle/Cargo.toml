[package]
name = "rhdl-doodle"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
eframe = { version = "0.33.3", features = ["persistence"] }
egui = "0.33.3"
egui_tiles = "0.14.1"
nonempty = "0.12.0"
pathfinding = "4.15.0"
petgraph = "0.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[dev-dependencies]
rand = { version = "0.10.0" }
